x-postgres-image: &pg-image postgres:${POSTGRES_VERSION:-18-alpine}

services:
  db:
    image: *pg-image
    container_name: parvis-db
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  backend:
    build: ./backend
    container_name: parvis-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CORS_ORIGINS=*
      - PARVIS_PASSWORD=${PARVIS_PASSWORD:-}
      - PARVIS_ADMIN_PASSWORD=${PARVIS_ADMIN_PASSWORD:-}
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - default

  frontend:
    build: ./frontend
    container_name: parvis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=/api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm start
    networks:
      - default

  nginx:
    image: nginx:alpine
    container_name: parvis-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default

  # Automated database backup sidecar (standardized across services).
  #   - Runs backup.sh on BACKUP_CRON_SCHEDULE via dcron, plus once at startup.
  #   - Dumps are Postgres custom-format (.dump); restore with restore_db.sh.
  #   - Dumps land on the parvis_backups volume.
  # Manual ops:
  #   docker compose exec backup /scripts/backup.sh                 # back up now
  #   docker compose exec backup ls -lh /backups/                   # list dumps
  #   docker compose exec backup /scripts/restore_db.sh /backups/parvis_db_YYYY-MM-DD_HH-MM-SS.dump
  #   docker compose restart backend                                # after a restore
  backup:
    image: *pg-image
    container_name: parvis-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SERVICE_NAME=parvis
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE:-0 3 * * *}
    volumes:
      - parvis_backups:/backups
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/backup-entrypoint.sh"]
    networks:
      - default

volumes:
  db_data:
    name: parvis_db
  # A plain local volume, so parvis runs standalone. A deployment that wants the
  # dumps on separate physical media redefines this volume from the outside.
  parvis_backups:
    name: parvis_backups

networks:
  default:
    name: parvis_internal
